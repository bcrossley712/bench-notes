<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bench Notes</title>
<meta name="theme-color" content="#1A1A1C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="vendor/msal-browser.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="updateBanner">
  <span>A new version is available.</span>
  <button onclick="applyUpdate()">Refresh</button>
</div>

<header>
  <div class="header-brand">
    <img src="icons/icon-192.png" alt="Bench Notes icon" id="headerIcon" onclick="openIconLightbox()">
    <h1>BENCH <span>NOTES</span></h1>
  </div>
  <div style="display:flex; gap:8px; align-items:center;">
    <button id="installBtn">Install</button>
    <button id="settingsGearBtn" onclick="openSettings()" aria-label="Settings">
      ⚙<span class="dot state-offline" id="settingsGearDot"></span>
    </button>
  </div>
</header>

<div class="modal-overlay" id="iconLightboxOverlay" onclick="closeIconLightbox()">
  <img src="icons/icon-512.png" alt="Bench Notes icon, large" class="icon-lightbox-img">
</div>

<div class="modal-overlay" id="settingsOverlay">
  <div class="modal-box settings-box">
    <div class="settings-header">
      <h2>Settings</h2>
      <button class="modal-btn cancel" onclick="closeSettings()">Close</button>
    </div>

    <div class="settings-section">
      <div class="settings-section-label">OneDrive Sync</div>
      <div class="settings-sync-row">
        <span class="dot state-offline" id="syncStatusDot"></span>
        <span id="syncStatusText" onclick="onSyncStatusClick()">Not signed in</span>
      </div>
      <button class="modal-btn confirm" id="syncActionBtn" onclick="onSyncButtonClick()">Connect OneDrive</button>
      <button class="modal-btn cancel" id="disconnectBtn" onclick="onSyncStatusClick()" style="display:none;">Disconnect</button>
    </div>

    <div class="settings-section">
      <div class="settings-section-label">Backup</div>
      <button class="modal-btn cancel" id="exportBtn" onclick="exportAllData()">Export backup</button>
      <button class="modal-btn cancel" id="restoreBtn" onclick="triggerRestoreInput()">Restore from backup</button>
      <button class="modal-btn cancel" id="compressPhotosBtn" onclick="compressExistingPhotos()">Compress older photos</button>
    </div>

    <div class="settings-section">
      <div class="settings-section-label">Maintenance</div>
      <button class="modal-btn cancel" id="cleanupBtn" onclick="cleanUpOldRecords()">Clean up old deleted entries…</button>
    </div>

    <div class="settings-section settings-danger">
      <div class="settings-section-label">Danger Zone</div>
      <button class="modal-btn confirm danger" onclick="startClearLocalData()">Clear local data…</button>
    </div>
  </div>
</div>
<input type="file" id="hiddenRestoreInput" accept="application/json" style="display:none">

<div id="iosBanner">
  Add to your Home Screen: tap Share, then "Add to Home Screen".
  <button onclick="document.getElementById('iosBanner').style.display='none'">Dismiss</button>
</div>

<div class="search-wrap">
  <input type="search" id="searchInput" placeholder="Search symptom, model, part..." oninput="render()" onsearch="this.blur()">
</div>

<div class="chip-scroll" id="statusFilters">
  <button class="chip active" data-status="all" onclick="setStatusFilter('all')">All</button>
  <button class="chip" data-status="needs-diagnosis" onclick="setStatusFilter('needs-diagnosis')">Needs Diagnosis</button>
  <button class="chip" data-status="waiting-parts" onclick="setStatusFilter('waiting-parts')">Waiting on Parts</button>
  <button class="chip" data-status="in-progress" onclick="setStatusFilter('in-progress')">In Progress</button>
  <button class="chip" data-status="complete" onclick="setStatusFilter('complete')">Complete</button>
</div>
<div class="chip-scroll" id="sourceFilters">
  <button class="chip active" data-source="all" onclick="setSourceFilter('all')">All</button>
  <button class="chip" data-source="dad" onclick="setSourceFilter('dad')">Dad</button>
  <button class="chip" data-source="experience" onclick="setSourceFilter('experience')">My experience</button>
  <button class="chip" data-source="ai" onclick="setSourceFilter('ai')">AI-assisted</button>
  <button class="chip" data-source="manual" onclick="setSourceFilter('manual')">Service manual</button>
</div>
<div class="chip-scroll" id="categoryFilters"></div>
<div class="stat-line" id="statLine"></div>

<div id="board" class="board"></div>

<button class="fab" onclick="openSheet()">+</button>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet" id="sheetContent"></div>
</div>

<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
  <span class="lightbox-counter" id="lightboxCounter"></span>
  <button type="button" class="lightbox-nav prev" id="lightboxPrev" onclick="lightboxPrev(event)">‹</button>
  <img id="lightboxImg" src="" alt="Photo">
  <button type="button" class="lightbox-nav next" id="lightboxNext" onclick="lightboxNext(event)">›</button>
  <button type="button" class="lightbox-cover-btn" id="lightboxCoverBtn" onclick="setCoverPhoto(event)">Set as cover</button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-message" id="modalMessage"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<input type="file" id="hiddenPhotoInput" accept="image/*" capture="environment" multiple style="display:none">
<input type="file" id="hiddenLibraryInput" accept="image/*" multiple style="display:none">

<script src="app.js"></script>
</body>
</html>
