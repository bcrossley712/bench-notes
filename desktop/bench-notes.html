<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bench Notes — Small Engine Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1A1A1C;
    --panel: #232326;
    --panel-raised: #2B2B2F;
    --tag: #E7E1D2;
    --tag-shadow: #00000055;
    --orange: #E85D25;
    --orange-dim: #B8461A;
    --brass: #C9A227;
    --ink: #2A2420;
    --ink-soft: #55493f;
    --paper-text: #EDE9E1;
    --muted: #9B9791;
    --rule: #3A3A3F;
    --danger: #C4432E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, #ffffff08 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--paper-text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.stamp{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}

  /* ---- Header / nameplate ---- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 28px;
    background:linear-gradient(180deg, #29292D, #202023);
    border-bottom:3px solid var(--orange);
    position:relative;
  }
  header .bolt{
    width:8px;height:8px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #6b6b6b, #1c1c1c);
    position:absolute;
  }
  header .bolt.tl{top:10px;left:10px;}
  header .bolt.tr{top:10px;right:10px;}
  header .bolt.bl{bottom:10px;left:10px;}
  header .bolt.br{bottom:10px;right:10px;}
  header h1{
    font-size:26px; margin:0; color:var(--paper-text);
    font-weight:700;
  }
  header h1 span{color:var(--orange);}
  header .subtitle{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; color:var(--muted); margin-top:4px;
    letter-spacing:0.02em;
  }
  .new-btn{
    background:var(--orange);
    color:#1A1A1C;
    border:none;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-size:14px;
    padding:12px 20px;
    border-radius:3px;
    cursor:pointer;
    box-shadow:0 2px 0 var(--orange-dim);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .new-btn:hover{transform:translateY(1px); box-shadow:0 1px 0 var(--orange-dim);}
  .new-btn:active{transform:translateY(2px); box-shadow:none;}

  /* ---- Layout ---- */
  .layout{
    display:grid;
    grid-template-columns: 280px 1fr;
    gap:0;
    min-height:calc(100vh - 92px);
  }
  @media (max-width: 800px){
    .layout{grid-template-columns:1fr;}
  }

  /* ---- Sidebar ---- */
  aside{
    background:var(--panel);
    border-right:1px solid var(--rule);
    padding:20px;
  }
  .drawer-label{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    color:var(--brass);
    letter-spacing:0.12em;
    margin-bottom:10px;
    text-transform:uppercase;
  }
  input[type=text], textarea, select{
    width:100%;
    background:var(--panel-raised);
    border:1px solid var(--rule);
    color:var(--paper-text);
    padding:10px 12px;
    border-radius:3px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14px;
  }
  input[type=text]:focus, textarea:focus, select:focus{
    outline:2px solid var(--orange);
    outline-offset:1px;
  }
  .search-box{margin-bottom:22px;}
  .filter-group{margin-bottom:20px;}
  .filter-group .drawer-label{margin-bottom:8px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    padding:5px 10px;
    border:1px solid var(--rule);
    border-radius:14px;
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--muted);
    cursor:pointer;
    background:transparent;
    transition:all .12s ease;
  }
  .chip.active{
    background:var(--orange);
    color:#1A1A1C;
    border-color:var(--orange);
    font-weight:600;
  }
  .chip:hover{border-color:var(--orange);}
  .stat-line{
    margin-top:24px;
    padding-top:16px;
    border-top:1px dashed var(--rule);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
  }
  .stat-line b{color:var(--paper-text);}

  /* ---- Main board ---- */
  main{padding:26px 30px;}
  .board-header{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:20px;
  }
  .board-header h2{font-size:15px;color:var(--muted); margin:0; font-weight:600;}
  .empty-state{
    text-align:center;
    padding:70px 20px;
    color:var(--muted);
  }
  .empty-state h3{color:var(--paper-text); font-size:20px; margin-bottom:8px;}
  .empty-state p{font-size:14px; max-width:380px; margin:0 auto 20px;}

  .board{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap:22px;
  }

  /* ---- Tag card (signature element) ---- */
  .tag-card{
    background:var(--tag);
    color:var(--ink);
    border-radius:2px;
    position:relative;
    padding:20px 20px 22px 34px;
    box-shadow: 3px 4px 0 var(--tag-shadow), 0 0 0 1px #0000000d;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 12% 100%, 0 88%);
  }
  .tag-card:hover{
    transform:translateY(-3px) rotate(-0.3deg);
    box-shadow: 5px 7px 0 var(--tag-shadow), 0 0 0 1px #0000000d;
  }
  .tag-card .grommet{
    position:absolute;
    top:16px; left:14px;
    width:14px; height:14px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #d8d2c0, #a49c86);
    box-shadow: inset 0 0 0 3px var(--tag);
  }
  .tag-card .tag-num{
    position:absolute;
    top:16px; left:34px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.05em;
  }
  .tag-card .source-mark{
    position:absolute;
    top:14px; right:14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    padding:3px 7px;
    border-radius:10px;
    letter-spacing:0.05em;
  }
  .source-dad{background:#C9A22733; color:#8a6d10;}
  .source-experience{background:#4a7a4a33; color:#2f5c2f;}
  .source-ai{background:#3a6ea533; color:#204d78;}
  .source-manual{background:#8383;}

  .status-badge{
    display:inline-block;
    font-family:'Oswald',sans-serif;
    font-size:10.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:#7a3a1a;
    background:#E85D2530;
    border:1px solid #E85D2560;
    padding:3px 9px;
    border-radius:2px;
    margin-bottom:8px;
  }
  .complete-badge{
    display:inline-block;
    font-family:'Oswald',sans-serif;
    font-size:10.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:#2f5c2f;
    background:#4a7a4a30;
    border:1px solid #4a7a4a60;
    padding:3px 9px;
    border-radius:2px;
    margin-bottom:8px;
  }

  .tag-card h3{
    margin:14px 0 6px;
    font-size:18px;
    color:var(--ink);
    line-height:1.25;
  }
  .tag-card .engine-badge{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    background:#00000010;
    padding:3px 8px;
    border-radius:2px;
    margin-bottom:10px;
  }
  .tag-card .preview{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.5;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .tag-card .tag-footer{
    margin-top:14px;
    display:flex; justify-content:space-between; align-items:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--ink-soft);
    border-top:1px dashed #00000022;
    padding-top:8px;
  }

  /* ---- Tab bar ---- */
  .tab-bar{
    display:flex; align-items:flex-end; gap:4px;
    background:var(--panel);
    border-bottom:1px solid var(--rule);
    padding:0 20px;
    overflow-x:auto;
  }
  .tab-item{
    display:flex; align-items:center; gap:8px;
    padding:11px 14px;
    background:var(--panel-raised);
    border:1px solid var(--rule);
    border-bottom:none;
    border-radius:4px 4px 0 0;
    color:var(--muted);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    max-width:220px;
    margin-top:6px;
  }
  .tab-item.active{
    background:var(--bg);
    color:var(--paper-text);
    border-color:var(--orange);
    margin-top:0;
    padding-top:13px;
  }
  .tab-item .tab-label{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tab-close{background:none; border:none; color:var(--muted); font-size:15px; cursor:pointer; padding:0 2px; line-height:1;}
  .tab-close:hover{color:var(--danger);}

  /* ---- Full-screen entry view (replaces the old popup modal) ---- */
  .entry-view{
    min-height:calc(100vh - 92px - 45px);
    overflow-y:auto;
    background:var(--bg);
  }
  .entry-view-inner{
    max-width:820px;
    margin:0 auto;
    padding:34px 36px 70px;
  }
  .entry-topbar{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:24px; padding-bottom:18px; border-bottom:2px solid var(--rule);
    gap:16px;
  }
  .entry-topbar h2{font-size:24px; margin:0 0 4px;}
  .entry-topbar-actions{display:flex; gap:10px; flex-shrink:0;}
  .checkbox-label{
    display:flex; align-items:center; gap:9px;
    font-family:'IBM Plex Sans',sans-serif; text-transform:none; letter-spacing:0;
    color:var(--paper-text); font-size:14.5px; cursor:pointer;
  }
  .checkbox-label input{width:17px; height:17px; accent-color:var(--orange); cursor:pointer;}
  .complete-tag{color:#5CA85C; font-weight:600;}

  .modal h2{font-size:20px; margin:0 0 4px;}
  .modal .modal-sub{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); margin-bottom:20px;}
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--brass);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  textarea{resize:vertical; min-height:64px; font-size:14px; line-height:1.5;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .form-section{border:1px solid var(--rule); border-radius:8px; padding:16px; margin-bottom:18px; background:var(--panel-raised);}
  .form-section-title{font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; font-size:13px; color:var(--orange); margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid var(--rule);}
  .form-subsection{margin-top:14px; padding-top:14px; border-top:1px dashed var(--rule);}
  .form-subsection-title{font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; font-size:11px; color:var(--brass); margin-bottom:10px;}
  .checklist-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .checklist-row{display:flex; align-items:center; gap:10px; background:var(--panel-raised); border:1px solid var(--rule); border-radius:6px; padding:8px 10px;}
  .checklist-check{display:flex; align-items:center; gap:8px; flex:1 1 auto; min-width:0; font-size:13.5px;}
  .checklist-check input[type="checkbox"]{width:16px; height:16px; flex:none;}
  .checklist-note{flex:1 1 40%; min-width:0; background:var(--panel); border:1px solid var(--rule); color:var(--paper-text); border-radius:4px; padding:6px 8px; font-size:12.5px;}
  .checklist-fix-preview{display:none; background:var(--panel-raised); border:1px solid var(--rule); border-left:3px solid var(--orange); border-radius:4px; padding:8px 10px; margin-bottom:8px; font-size:13px;}
  .checklist-fix-line{padding:2px 0;}
  .checklist-fix-line + .checklist-fix-line{border-top:1px dashed var(--rule);}
  .modal-actions{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:22px; padding-top:16px;
    border-top:1px solid var(--rule);
  }
  .btn{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-size:13px;
    padding:10px 18px;
    border-radius:3px;
    border:none;
    cursor:pointer;
  }
  .btn-save{background:var(--orange); color:#1A1A1C; font-weight:600;}
  .btn-cancel{background:transparent; color:var(--muted); border:1px solid var(--rule);}
  .btn-delete{background:transparent; color:var(--danger); border:1px solid var(--danger); font-size:12px; padding:7px 12px;}

  /* ---- Detail view ---- */
  .detail-section{margin-bottom:16px;}
  .detail-section .drawer-label{color:var(--brass); margin-bottom:6px;}
  .detail-section p{font-size:14px; line-height:1.6; color:var(--paper-text); margin:0; white-space:pre-wrap;}
  .detail-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}

  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:var(--rule); border-radius:4px;}

  /* ---- Photo elements ---- */
  .card-photo-thumb{
    margin-top:12px;
    height:90px;
    border-radius:2px;
    background-color:#00000015;
    background-size:cover;
    background-position:center;
    position:relative;
    display:flex; align-items:flex-end;
  }
  .card-photo-thumb .photo-count{
    background:#000000aa;
    color:#fff;
    font-size:10px;
    padding:2px 6px;
    border-radius:2px;
    margin:6px;
  }
  .photo-field-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(84px, 1fr));
    gap:8px;
    margin-bottom:10px;
  }
  .photo-thumb-wrap{
    position:relative;
    height:84px;
    border-radius:3px;
    overflow:hidden;
    background:#00000030;
    background-size:cover;
    background-position:center;
    cursor:pointer;
  }
  .photo-thumb-wrap .remove-x{
    position:absolute; top:3px; right:3px;
    width:20px; height:20px;
    background:#000000aa;
    color:#fff;
    border:none;
    border-radius:50%;
    font-size:13px;
    line-height:20px;
    text-align:center;
    cursor:pointer;
    padding:0;
  }
  .photo-actions-row{display:flex; gap:10px; margin-bottom:10px;}
  .btn-photo{
    background:var(--panel-raised);
    color:var(--paper-text);
    border:1px solid var(--rule);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    padding:8px 14px;
    border-radius:3px;
    cursor:pointer;
  }
  .btn-photo:hover{border-color:var(--orange);}

  .camera-box{
    background:#000;
    border-radius:4px;
    overflow:hidden;
    margin-bottom:10px;
    position:relative;
  }
  .camera-box video{width:100%; display:block; max-height:320px;}
  .camera-controls{
    display:flex; justify-content:center; gap:10px;
    padding:10px;
    background:var(--panel-raised);
  }

  .lightbox-overlay{
    position:fixed; inset:0;
    background:#000000d0;
    display:none;
    align-items:center; justify-content:center;
    z-index:60;
    padding:30px;
  }
  .lightbox-overlay.open{display:flex;}
  .lightbox-overlay img{max-width:100%; max-height:100%; border-radius:4px;}

  .modal-overlay{position:fixed; inset:0; background:#000000c0; display:none; align-items:center; justify-content:center; z-index:80; padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:var(--panel); border:1px solid var(--rule); border-top:3px solid var(--orange); border-radius:8px; max-width:380px; width:100%; padding:20px; box-shadow:0 12px 32px #00000060;}
  .modal-message{font-size:14.5px; line-height:1.5; margin-bottom:18px; white-space:pre-wrap;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end;}
  .modal-btn{padding:10px 16px; border-radius:6px; font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:12.5px; font-weight:600; border:none; cursor:pointer;}
  .modal-btn.cancel{background:transparent; color:var(--muted); border:1px solid var(--rule);}
  .modal-btn.confirm{background:var(--orange); color:#1A1A1C;}
  .modal-btn.confirm.danger{background:var(--danger); color:#fff;}
</style>
</head>
<body>

<header>
  <div class="bolt tl"></div><div class="bolt tr"></div><div class="bolt bl"></div><div class="bolt br"></div>
  <div>
    <h1>BENCH <span>NOTES</span></h1>
    <div class="subtitle">SMALL ENGINE REFERENCE — WORK ORDER LOG</div>
  </div>
  <button class="new-btn" onclick="openNewEntryTab()">+ New Entry</button>
</header>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-message" id="modalMessage"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>


<div class="tab-bar" id="tabBar"></div>

<div id="boardView">
<div class="layout">
  <aside>
    <div class="search-box">
      <div class="drawer-label">Search</div>
      <input type="text" id="searchInput" placeholder="symptom, model, part..." oninput="render()">
    </div>

    <div class="filter-group">
      <div class="drawer-label">Status</div>
      <div class="chip-row" id="statusFilters">
        <button class="chip active" data-status="all" onclick="setStatusFilter('all')">All</button>
        <button class="chip" data-status="needs-diagnosis" onclick="setStatusFilter('needs-diagnosis')">Needs Diagnosis</button>
        <button class="chip" data-status="complete" onclick="setStatusFilter('complete')">Complete</button>
      </div>
    </div>

    <div class="filter-group">
      <div class="drawer-label">Engine Type</div>
      <div class="chip-row" id="engineFilters"></div>
    </div>

    <div class="filter-group">
      <div class="drawer-label">Source</div>
      <div class="chip-row" id="sourceFilters">
        <button class="chip" data-source="all" onclick="setSourceFilter('all')">All</button>
        <button class="chip" data-source="dad" onclick="setSourceFilter('dad')">Dad</button>
        <button class="chip" data-source="experience" onclick="setSourceFilter('experience')">My experience</button>
        <button class="chip" data-source="ai" onclick="setSourceFilter('ai')">AI-assisted</button>
        <button class="chip" data-source="manual" onclick="setSourceFilter('manual')">Service manual</button>
      </div>
    </div>

    <div class="stat-line" id="statLine"></div>

    <div class="filter-group" style="margin-top:20px;">
      <div class="drawer-label">Storage Folder</div>
      <div id="storagePathDisplay" class="mono" style="font-size:11px; color:var(--muted); word-break:break-all; margin-bottom:8px; line-height:1.5;"></div>
      <button class="chip" style="width:100%; text-align:center;" onclick="changeStorageFolder()">Change folder…</button>
    </div>
  </aside>

  <main>
    <div class="board-header">
      <h2 id="boardCount">0 entries</h2>
    </div>
    <div id="board" class="board"></div>
  </main>
</div>
</div>

<div class="entry-view" id="entryView" style="display:none;"></div>

<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="Photo">
</div>

<script>
// ---------- Custom modal (replaces native alert()/confirm()) ----------
function showAlert(message, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalMessage').textContent = message;
    const actions = document.getElementById('modalActions');
    actions.innerHTML = '';
    const okBtn = document.createElement('button');
    okBtn.className = 'modal-btn confirm';
    okBtn.textContent = opts.okLabel || 'OK';
    okBtn.onclick = ()=>{ overlay.classList.remove('open'); resolve(); };
    actions.appendChild(okBtn);
    overlay.classList.add('open');
    okBtn.focus();
  });
}

function showConfirm(message, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalMessage').textContent = message;
    const actions = document.getElementById('modalActions');
    actions.innerHTML = '';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'modal-btn cancel';
    cancelBtn.textContent = opts.cancelLabel || 'Cancel';
    cancelBtn.onclick = ()=>{ overlay.classList.remove('open'); resolve(false); };
    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'modal-btn confirm' + (opts.danger === false ? '' : ' danger');
    confirmBtn.textContent = opts.confirmLabel || 'Confirm';
    confirmBtn.onclick = ()=>{ overlay.classList.remove('open'); resolve(true); };
    actions.appendChild(cancelBtn);
    actions.appendChild(confirmBtn);
    overlay.classList.add('open');
    confirmBtn.focus();
  });
}

let entries = [];
let engineFilter = 'all';
let sourceFilter = 'all';
let statusFilter = 'all';
let photoCache = {};       // filename -> data URL, avoids re-reading from disk
let cameraStream = null;

let openTabs = [];          // {id, mode:'view'|'edit', isNew, draftPhotos:[]}
let activeTabId = 'board';  // 'board' or a tab id

const SOURCE_LABELS = {dad:'From Dad', experience:'My experience', ai:'AI-assisted', manual:'Service manual'};

const CHECKLIST_ITEMS = [
  ['sparkTest','Spark Test'], ['sparkPlug','Spark Plug'], ['compressionTest','Compression Test'],
  ['fuelTank','Fuel Tank'], ['fuelFilter','Fuel Filter'], ['fuelAdditive','Fuel Additive'],
  ['airFilter','Air Filter'], ['oilChange','Oil Change'], ['oilFilter','Oil Filter'],
  ['lubeFrontEnd','Lube Front End'], ['tirePressure','Tire Pressure'], ['cleanDeck','Clean Deck'],
  ['bladeSharpening','Blade Sharpening']
];

async function loadStorageInfo(){
  try{
    const info = await window.api.getStorageInfo();
    document.getElementById('storagePathDisplay').textContent = info.dataDir;
  }catch(e){
    console.error('Could not read storage info', e);
  }
}

async function changeStorageFolder(){
  const result = await window.api.chooseStorageFolder();
  if(result.ok){
    document.getElementById('storagePathDisplay').textContent = result.dataDir;
    photoCache = {};
    openTabs = [];          // old tabs may reference entries that don't exist in the new folder
    activeTabId = 'board';
    await loadEntries();
    await showAlert('Storage folder updated. New entries and photos will be saved there.\n\nTip: point this at a Dropbox, Google Drive, or OneDrive folder to sync with a phone app later.');
  }
}

async function loadEntries(){
  try{
    entries = await window.api.loadEntries();
  }catch(e){
    console.error('Load failed', e);
    entries = [];
  }
  await ensureOrderNumbers();
  renderWorkspace();
}

// One-time migration + safety net: every entry gets a permanent orderNumber
// the first time it's seen without one, assigned in creation order so old
// entries keep roughly the numbering they already had. Once set, an
// entry's number never changes again regardless of what else is added/removed.
async function ensureOrderNumbers(){
  const missing = entries.filter(e => !e.orderNumber);
  if(missing.length === 0) return;
  let next = entries.reduce((max,e)=> e.orderNumber ? Math.max(max, e.orderNumber) : max, 0) + 1;
  missing.sort((a,b)=> (a.createdAt||0) - (b.createdAt||0));
  for(const entry of missing){
    entry.orderNumber = next++;
  }
  await saveEntries();
}

async function saveEntries(){
  try{
    const result = await window.api.saveEntries(entries);
    if(result && result.ok === false){
      await showAlert('Could not save your entries: ' + (result.error || 'unknown error'));
    }
  }catch(e){
    console.error('Save failed', e);
    await showAlert('Could not save your entries. Please try again.');
  }
}

function uid(){ return 'e' + Date.now() + Math.floor(Math.random()*1000); }

function setSourceFilter(s){
  sourceFilter = s;
  document.querySelectorAll('#sourceFilters .chip').forEach(c=>{
    c.classList.toggle('active', c.dataset.source === s);
  });
  render();
}

function setStatusFilter(s){
  statusFilter = s;
  document.querySelectorAll('#statusFilters .chip').forEach(c=>{
    c.classList.toggle('active', c.dataset.status === s);
  });
  render();
}

function setEngineFilter(e){
  engineFilter = e;
  render();
}

function renderEngineFilters(){
  const types = Array.from(new Set(entries.filter(e=>!e.deleted).map(e=>e.engineModel).filter(Boolean))).sort();
  const wrap = document.getElementById('engineFilters');
  wrap.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (engineFilter==='all' ? ' active':'');
  allChip.textContent = 'All';
  allChip.onclick = ()=>{ engineFilter='all'; renderEngineFilters(); render(); };
  wrap.appendChild(allChip);
  types.forEach(t=>{
    const chip = document.createElement('button');
    chip.className = 'chip' + (engineFilter===t ? ' active':'');
    chip.textContent = t;
    chip.onclick = ()=>{ engineFilter=t; renderEngineFilters(); render(); };
    wrap.appendChild(chip);
  });
}

function matchesFilters(entry, q){
  // Tombstoned entries (deleted:true) stay in the entries array so they
  // still get written to disk and can propagate the deletion on sync —
  // they just never show up in any filtered/rendered view.
  if(entry.deleted) return false;
  if(engineFilter !== 'all' && entry.engineModel !== engineFilter) return false;
  if(sourceFilter !== 'all' && entry.source !== sourceFilter) return false;
  if(statusFilter === 'needs-diagnosis' && !isNeedsDiagnosis(entry)) return false;
  if(statusFilter === 'complete' && !entry.completed) return false;
  if(q){
    const hay = [entry.title, entry.engineModel, entry.engineCode, entry.causes, entry.steps, entry.fix,
      entry.partsUsed, entry.notes, entry.customerName, entry.customerPhone,
      entry.equipmentModel, entry.equipmentSerial, entry.customerRequest,
      ...checklistLines(entry.checklist||{})].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function render(){
  renderEngineFilters();
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const visible = entries.filter(e=>!e.deleted);
  const filtered = entries.filter(e=>matchesFilters(e,q))
                          .sort((a,b)=> b.createdAt - a.createdAt);

  document.getElementById('boardCount').textContent =
    filtered.length + (filtered.length===1 ? ' entry' : ' entries') +
    (visible.length !== filtered.length ? ' (of ' + visible.length + ')' : '');

  const board = document.getElementById('board');
  board.innerHTML = '';

  if(visible.length === 0){
    board.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <h3>No work orders yet</h3>
      <p>Start logging the fixes, symptoms, and know-how as you and your dad work through jobs. Every entry becomes something you can search for later.</p>
      <button class="new-btn" onclick="openNewEntryTab()">+ Log your first entry</button>
    </div>`;
  } else if(filtered.length === 0){
    board.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <h3>Nothing matches</h3>
      <p>Try a different search term or clear your filters.</p>
    </div>`;
  } else {
    filtered.forEach((entry, idx)=>{
      const card = document.createElement('div');
      card.className = 'tag-card';
      card.onclick = ()=>openEntryTab(entry.id);
      const num = String(entry.orderNumber || 0).padStart(3,'0');
      const hasPhotos = entry.photos && entry.photos.length > 0;
      const needsDiag = isNeedsDiagnosis(entry);
      const headline = entry.title || entry.customerName || 'Untitled entry';
      card.innerHTML = `
        <div class="grommet"></div>
        <div class="tag-num">#${num}</div>
        <div class="source-mark source-${entry.source}">${SOURCE_LABELS[entry.source]||''}</div>
        ${entry.completed ? `<div class="complete-badge">✓ Complete</div>` : (needsDiag ? `<div class="status-badge">Needs Diagnosis</div>` : '')}
        ${entry.engineModel ? `<div class="engine-badge">${escapeHtml(entry.engineModel)}</div>` : ''}
        <h3>${escapeHtml(headline)}</h3>
        ${entry.title && entry.customerName ? `<div class="mono" style="font-size:11.5px; color:var(--ink-soft); margin-bottom:4px;">Customer: ${escapeHtml(entry.customerName)}</div>` : ''}
        <div class="preview">${escapeHtml(entry.fix || entry.causes || entry.customerRequest || '')}</div>
        ${hasPhotos ? `<div class="card-photo-thumb" data-filename="${entry.photos[0]}"><span class="mono photo-count">${entry.photos.length} photo${entry.photos.length>1?'s':''}</span></div>` : ''}
        <div class="tag-footer">
          <span>${entry.dateAdded || ''}</span>
          <span>OPEN →</span>
        </div>
      `;
      board.appendChild(card);
    });
    // Fill in thumbnails after cards are in the DOM (photo reads are async)
    board.querySelectorAll('.card-photo-thumb').forEach(async (el)=>{
      const filename = el.dataset.filename;
      const dataUrl = await getPhotoDataCached(filename);
      if(dataUrl){
        el.style.backgroundImage = `url(${dataUrl})`;
      }
    });
  }

  const dadCount = visible.filter(e=>e.source==='dad').length;
  document.getElementById('statLine').innerHTML =
    `<b>${visible.length}</b> total logged<br><b>${dadCount}</b> straight from Dad`;
}

function isNeedsDiagnosis(entry){
  return !entry.completed && !entry.title && !entry.causes && !entry.steps && !entry.fix;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// ---------- Tabs ----------
function getActiveTab(){
  return openTabs.find(t=>t.id===activeTabId) || null;
}

function renderTabBar(){
  const bar = document.getElementById('tabBar');
  let html = `<button class="tab-item ${activeTabId==='board' ? 'active' : ''}" onclick="switchTab('board')">Board</button>`;
  openTabs.forEach(tab=>{
    const entry = !tab.isNew ? entries.find(e=>e.id===tab.id) : null;
    const label = tab.isNew ? 'New Entry' : (entry ? (entry.title || entry.customerName || 'Untitled') : 'Entry');
    html += `<div class="tab-item ${tab.id===activeTabId ? 'active' : ''}" onclick="switchTab('${tab.id}')">
      <span class="tab-label">${escapeHtml(label)}</span>
      <button type="button" class="tab-close" onclick="event.stopPropagation(); closeTab('${tab.id}')">×</button>
    </div>`;
  });
  bar.innerHTML = html;
}

function switchTab(id){
  activeTabId = id;
  renderWorkspace();
}

function renderWorkspace(){
  renderTabBar();
  const boardView = document.getElementById('boardView');
  const entryView = document.getElementById('entryView');
  if(activeTabId === 'board'){
    boardView.style.display = '';
    entryView.style.display = 'none';
    render();
  } else {
    boardView.style.display = 'none';
    entryView.style.display = 'block';
    const tab = getActiveTab();
    if(!tab){ switchTab('board'); return; }
    if(tab.mode === 'edit'){
      renderEntryForm(tab);
    } else {
      renderEntryDetail(tab);
    }
  }
}

function openNewEntryTab(){
  const id = 'new-' + uid();
  openTabs.push({id, mode:'edit', isNew:true, draftPhotos:[]});
  switchTab(id);
}

function openEntryTab(entryId){
  let tab = openTabs.find(t=>t.id===entryId);
  if(!tab){
    tab = {id: entryId, mode:'view', isNew:false, draftPhotos:[]};
    openTabs.push(tab);
  }
  switchTab(entryId);
}

async function closeTab(id){
  const tab = openTabs.find(t=>t.id===id);
  if(tab && tab.isNew && tab.mode === 'edit'){
    const ok = await showConfirm('Discard this new work order? Nothing will be saved.', {confirmLabel:'Discard'});
    if(!ok) return;
  }
  closeCamera();
  openTabs = openTabs.filter(t=>t.id!==id);
  if(activeTabId === id){
    switchTab('board');
  } else {
    renderTabBar();
  }
}

function cancelEdit(tabId){
  closeCamera();
  const tab = openTabs.find(t=>t.id===tabId);
  if(!tab) return;
  if(tab.isNew){
    closeTab(tabId);
  } else {
    tab.mode = 'view';
    renderWorkspace();
  }
}

function switchToEditMode(tabId){
  const tab = openTabs.find(t=>t.id===tabId);
  if(!tab) return;
  const entry = entries.find(e=>e.id===tabId);
  tab.mode = 'edit';
  tab.draftPhotos = entry && entry.photos ? [...entry.photos] : [];
  renderWorkspace();
}

function getChecklistState(){
  const state = {};
  CHECKLIST_ITEMS.forEach(([key])=>{
    const cb = document.getElementById('cl_'+key+'_checked');
    const note = document.getElementById('cl_'+key+'_note');
    state[key] = { checked: cb ? cb.checked : false, note: note ? note.value.trim() : '' };
  });
  return state;
}

// Builds the "Label - note" lines for currently-checked items. Single source of
// truth used by the edit-form preview, the detail view, and search — never
// written into the editable Fix textarea, so there's nothing to drift out of sync.
function checklistLines(checklistState){
  return CHECKLIST_ITEMS
    .filter(([key])=> checklistState[key] && checklistState[key].checked)
    .map(([key,label])=> `${label} - ${(checklistState[key].note||'').trim() || 'done'}`);
}

function renderChecklistPreview(){
  const el = document.getElementById('checklistFixPreview');
  if(!el) return;
  const lines = checklistLines(getChecklistState());
  el.innerHTML = lines.length
    ? lines.map(l=>`<div class="checklist-fix-line">${escapeHtml(l)}</div>`).join('')
    : '';
  el.style.display = lines.length ? 'block' : 'none';
}

function onChecklistChange(){
  renderChecklistPreview();
}

async function getPhotoDataCached(filename){
  if(photoCache[filename]) return photoCache[filename];
  const dataUrl = await window.api.getPhotoData(filename);
  if(dataUrl) photoCache[filename] = dataUrl;
  return dataUrl;
}

async function renderDraftPhotoGrid(){
  const tab = getActiveTab();
  if(!tab) return;
  const grid = document.getElementById('draftPhotoGrid');
  if(!grid) return;
  grid.innerHTML = '';
  for(const filename of tab.draftPhotos){
    const wrap = document.createElement('div');
    wrap.className = 'photo-thumb-wrap';
    wrap.innerHTML = `<button type="button" class="remove-x" onclick="event.stopPropagation(); removeDraftPhoto('${filename}')">×</button>`;
    wrap.onclick = ()=>openLightbox(filename);
    grid.appendChild(wrap);
    const dataUrl = await getPhotoDataCached(filename);
    if(dataUrl) wrap.style.backgroundImage = `url(${dataUrl})`;
  }
}

async function addPhotosFromFiles(){
  const tab = getActiveTab();
  if(!tab) return;
  const filenames = await window.api.addPhotos();
  if(filenames && filenames.length){
    tab.draftPhotos.push(...filenames);
    renderDraftPhotoGrid();
  }
}

async function removeDraftPhoto(filename){
  const tab = getActiveTab();
  if(!tab) return;
  tab.draftPhotos = tab.draftPhotos.filter(f=>f!==filename);
  await window.api.deletePhoto(filename);
  delete photoCache[filename];
  renderDraftPhotoGrid();
}

async function openCamera(){
  const container = document.getElementById('cameraContainer');
  container.innerHTML = `
    <div class="camera-box">
      <video id="cameraVideo" autoplay playsinline></video>
      <div class="camera-controls">
        <button type="button" class="btn-photo" onclick="capturePhoto()">Capture</button>
        <button type="button" class="btn-photo" onclick="closeCamera()">Cancel</button>
      </div>
    </div>
  `;
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
    document.getElementById('cameraVideo').srcObject = cameraStream;
  }catch(err){
    console.error('Camera access failed', err);
    container.innerHTML = '<p style="font-size:13px;color:var(--muted);">Could not access a camera on this computer.</p>';
  }
}

function closeCamera(){
  if(cameraStream){
    cameraStream.getTracks().forEach(t=>t.stop());
    cameraStream = null;
  }
  const container = document.getElementById('cameraContainer');
  if(container) container.innerHTML = '';
}

async function capturePhoto(){
  const tab = getActiveTab();
  if(!tab) return;
  const video = document.getElementById('cameraVideo');
  if(!video) return;
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
  closeCamera();
  const result = await window.api.saveCapturedPhoto(dataUrl);
  if(result.ok){
    photoCache[result.filename] = dataUrl;
    tab.draftPhotos.push(result.filename);
    renderDraftPhotoGrid();
  } else {
    await showAlert('Could not save the photo: ' + (result.error || 'unknown error'));
  }
}

function openLightbox(filename){
  getPhotoDataCached(filename).then(dataUrl=>{
    if(!dataUrl) return;
    document.getElementById('lightboxImg').src = dataUrl;
    document.getElementById('lightboxOverlay').classList.add('open');
  });
}

function closeLightbox(){
  document.getElementById('lightboxOverlay').classList.remove('open');
}

  if(!entry){ closeTab(tab.id); return; }
  const hasPhotos = entry.photos && entry.photos.length > 0;
  document.getElementById('entryView').innerHTML = `
    <div class="entry-view-inner">
      <div class="entry-topbar">
        <div>
          <h2>${escapeHtml(entry.title || entry.customerName || 'Untitled entry')}</h2>
          <div class="modal-sub">${[entry.engineModel, entry.engineCode].filter(Boolean).join(' · ')}${(entry.engineModel||entry.engineCode) ? ' · ' : ''}${SOURCE_LABELS[entry.source]||''} · ${entry.dateAdded||''}${entry.completed ? ' · <span class="complete-tag">✓ Complete</span>' : ''}</div>
        </div>
        <div class="entry-topbar-actions">
          <button class="btn btn-cancel" onclick="closeTab('${tab.id}')">Close</button>
          <button class="btn btn-save" onclick="switchToEditMode('${tab.id}')">Edit</button>
        </div>
      </div>
      ${(entry.customerName || entry.customerPhone || entry.dateReceived || entry.customerRequest) ? `<div class="detail-section"><div class="drawer-label">Customer</div><p>${[
          entry.customerName && escapeHtml(entry.customerName),
          entry.customerPhone && escapeHtml(entry.customerPhone),
          entry.dateReceived && ('Received ' + escapeHtml(entry.dateReceived))
        ].filter(Boolean).join('<br>')}</p>${entry.customerRequest ? `<p style="margin-top:8px;"><span class="mono" style="color:var(--muted); font-size:11px;">REQUEST</span><br>${escapeHtml(entry.customerRequest)}</p>` : ''}</div>` : ''}
      ${(entry.equipmentModel || entry.equipmentSerial || entry.engineModel || entry.engineCode) ? `<div class="detail-section"><div class="drawer-label">Equipment</div><p>${[
          entry.equipmentModel && escapeHtml(entry.equipmentModel),
          entry.equipmentSerial && ('SN ' + escapeHtml(entry.equipmentSerial))
        ].filter(Boolean).join('<br>')}</p>${(entry.engineModel || entry.engineCode) ? `<p style="margin-top:8px;"><span class="mono" style="color:var(--muted); font-size:11px;">ENGINE</span><br>${[
          entry.engineModel && escapeHtml(entry.engineModel),
          entry.engineCode && escapeHtml(entry.engineCode)
        ].filter(Boolean).join('<br>')}</p>` : ''}</div>` : ''}
      ${entry.causes ? `<div class="detail-section"><div class="drawer-label">Likely Causes</div><p>${escapeHtml(entry.causes)}</p></div>` : ''}
      ${entry.steps ? `<div class="detail-section"><div class="drawer-label">Diagnostic Steps</div><p>${escapeHtml(entry.steps)}</p></div>` : ''}
      ${(entry.fix || checklistLines(entry.checklist||{}).length) ? (()=>{
          const clLines = checklistLines(entry.checklist||{});
          return `<div class="detail-section"><div class="drawer-label">The Fix</div>${clLines.length ? `<div class="checklist-fix-preview" style="display:block; margin-bottom:${entry.fix?'10px':'0'};">${clLines.map(l=>`<div class="checklist-fix-line">${escapeHtml(l)}</div>`).join('')}</div>` : ''}${entry.fix ? `<p>${escapeHtml(entry.fix)}</p>` : ''}</div>`;
        })() : ''}
      ${entry.partsUsed ? `<div class="detail-section"><div class="drawer-label">Parts Used</div><p>${escapeHtml(entry.partsUsed)}</p></div>` : ''}
      ${entry.notes ? `<div class="detail-section"><div class="drawer-label">Notes</div><p>${escapeHtml(entry.notes)}</p></div>` : ''}
      ${hasPhotos ? `<div class="detail-section"><div class="drawer-label">Photos</div><div class="photo-field-grid" id="detailPhotoGrid"></div></div>` : ''}
      <div class="modal-actions" style="border-top:none; padding-top:0; justify-content:flex-start;">
        <button class="btn btn-delete" onclick="deleteEntry('${entry.id}')">Delete entry</button>
      </div>
    </div>
  `;
  if(hasPhotos) renderDetailPhotoGrid(entry.photos);
}

async function renderDetailPhotoGrid(photos){
  const grid = document.getElementById('detailPhotoGrid');
  if(!grid) return;
  grid.innerHTML = '';
  for(const filename of photos){
    const wrap = document.createElement('div');
    wrap.className = 'photo-thumb-wrap';
    wrap.onclick = ()=>openLightbox(filename);
    grid.appendChild(wrap);
    const dataUrl = await getPhotoDataCached(filename);
    if(dataUrl) wrap.style.backgroundImage = `url(${dataUrl})`;
  }
}

async function saveEntry(){
  const tab = getActiveTab();
  if(!tab) return;
  const title = document.getElementById('f_title').value.trim();
  const customerName = document.getElementById('f_customerName').value.trim();
  if(!title && !customerName){
    await showAlert('Add at least a customer name or a symptom title so you can find this again.');
    return;
  }

  const data = {
    title,
    engineModel: document.getElementById('f_engineModel').value.trim(),
    engineCode: document.getElementById('f_engineCode').value.trim(),
    source: document.getElementById('f_source').value,
    causes: document.getElementById('f_causes').value.trim(),
    steps: document.getElementById('f_steps').value.trim(),
    fix: document.getElementById('f_fix').value.trim(),
    partsUsed: document.getElementById('f_partsUsed').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
    photos: [...tab.draftPhotos],
    customerName,
    customerPhone: document.getElementById('f_customerPhone').value.trim(),
    equipmentModel: document.getElementById('f_equipmentModel').value.trim(),
    equipmentSerial: document.getElementById('f_equipmentSerial').value.trim(),
    dateReceived: document.getElementById('f_dateReceived').value,
    customerRequest: document.getElementById('f_customerRequest').value.trim(),
    completed: document.getElementById('f_completed').checked,
    checklist: getChecklistState()
  };

  if(tab.isNew){
    const newId = uid();
    const nextNum = entries.reduce((max,e)=> e.orderNumber ? Math.max(max,e.orderNumber) : max, 0) + 1;
    entries.push({
      id: newId,
      ...data,
      orderNumber: nextNum,
      createdAt: Date.now(),
      updatedAt: Date.now(),
      dateAdded: new Date().toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})
    });
    tab.id = newId;
    tab.isNew = false;
    activeTabId = newId;
  } else {
    const idx = entries.findIndex(e=>e.id===tab.id);
    if(idx>-1){
      entries[idx] = {...entries[idx], ...data, updatedAt: Date.now()};
    }
  }
  tab.mode = 'view';
  await saveEntries();
  renderWorkspace();
}

async function deleteEntry(id){
  const ok = await showConfirm("Delete this entry? This can't be undone.", {confirmLabel:'Delete'});
  if(!ok) return;
  const entry = entries.find(e=>e.id===id);
  if(entry){
    if(entry.photos && entry.photos.length){
      for(const filename of entry.photos){
        await window.api.deletePhoto(filename);
        delete photoCache[filename];
      }
    }
    // Tombstone, not a hard delete: stays in entries[] (and so still gets
    // written to disk) so the sync merge logic can propagate this deletion
    // to the other device instead of the entry silently reappearing.
    entry.deleted = true;
    entry.photos = [];
    entry.updatedAt = Date.now();
  }
  await saveEntries();
  closeTab(id);
}

loadStorageInfo();
loadEntries();
</script>
